[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Poker simulation and AI research environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.13",
	"fastapi>=0.115",
	"numpy>=2.0",
	"psycopg[binary]>=3.2",
	"pydantic>=2.8",
	"pydantic-settings>=2.4",
	"pyyaml>=6.0",
	"sqlalchemy>=2.0",
	"typer>=0.12",
	"uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ml = [
	"gymnasium>=1.0",
	"torch>=2.4",
]
dev = [
	"mypy>=1.11",
	"pytest>=8.3",
	"pytest-cov>=5.0",
	"ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["poker"]
